name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Release on a version tag. Dual-purpose (like quality-gate / security-scan):
#   • For the EEIK engine repo → build + publish the `eeik` Python package to PyPI (OIDC trusted
#     publishing — no long-lived token), and cut a GitHub Release.
#   • As a seed template downstream → the Java JAR + container jobs self-skip until a pom.xml / Dockerfile
#     exists, then build and push a product artifact.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'             # v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'   # v1.2.3-rc.1

permissions:
  contents: write

jobs:
  # ─── Validate Tag ────────────────────────────────────────────────────────────
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse version tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-rc."* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing: $TAG (version: $VERSION)"

      - name: Check tag is on main branch
        if: steps.parse.outputs.is_prerelease == 'false'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: Production release tags must be on the main branch"
            exit 1
          fi

  # ─── Publish the `eeik` engine to PyPI (OIDC trusted publishing) ─────────────
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.is_prerelease == 'false'
    environment: pypi          # configure a PyPI Trusted Publisher for this repo + environment
    permissions:
      id-token: write          # OIDC — no PyPI API token stored anywhere
    steps:
      - uses: actions/checkout@v7

      - name: Detect Python package
        id: detect
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml — skipping PyPI publish."
          fi

      - name: Set up Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify version matches tag
        if: steps.detect.outputs.present == 'true'
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PKG" != "${{ needs.validate.outputs.version }}" ]; then
            echo "ERROR: pyproject version $PKG != tag ${{ needs.validate.outputs.version }}"
            exit 1
          fi

      - name: Build sdist + wheel
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.detect.outputs.present == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing by default — no username/password/token.

  # ─── Java / Spring Boot product artifact (downstream seed template) ──────────
  build-java:
    name: Build Java Artefact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - name: Detect Java project
        id: detect
        run: |
          if [ -f pom.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pom.xml — this repo has no Java product. Skipping Java build."
          fi

      - name: Set up Java 21
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build production JAR
        if: steps.detect.outputs.present == 'true'
        run: mvn -B package -DskipTests --no-transfer-progress -Drevision=${{ needs.validate.outputs.version }}

      - name: Upload JAR artefact
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: target/*.jar
          retention-days: 30

  # ─── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, pypi, build-java]
    if: always() && needs.validate.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artefacts (if any)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: release-artefacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md)
            for the curated notes; the auto-generated commit list is below.

            **Install the engine:** `pip install eeik==${{ needs.validate.outputs.version }}`
          files: |
            release-artefacts/**/*
