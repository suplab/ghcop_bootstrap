name: Quality Gate

# ─────────────────────────────────────────────────────────────────────────────
# DOWNSTREAM-PRODUCT quality gate — this is a SEED template.
#
# It is copied (with the rest of `.github/`) into projects generated from EEIK, where it builds and
# tests the product's Java / Angular / Python code. EEIK's `.github/` is dual-purpose (ADR-005): it is
# both this seed AND EEIK's own CI. On the eeik-bootstrap repo itself — an engine + content repo with
# no product build (no pom.xml / package.json / src/) — each job below **self-skips** after a detect
# step, so it is green here and fully functional downstream. EEIK's *own* Python engine is gated by
# `.github/workflows/eeik-validate.yml` (engine tests, verify, drift, agent-lint), not by this file.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ─── Java / Spring Boot ─────────────────────────────────────────────────────
  java-quality:
    name: Java — Build, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect Java project
        id: detect
        run: |
          if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pom.xml/build.gradle — this repo has no Java project. Skipping Java quality gate."
          fi

      - name: Set up Java 21
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with coverage
        if: steps.detect.outputs.present == 'true'
        run: mvn -B verify --no-transfer-progress -Pcoverage
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Check coverage thresholds
        if: steps.detect.outputs.present == 'true'
        run: |
          mvn -B jacoco:check --no-transfer-progress \
            -Djacoco.minimum.line.coverage=0.80 \
            -Djacoco.minimum.branch.coverage=0.70

      - name: Publish JaCoCo report
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: '**/target/site/jacoco/jacoco.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: 'Java Coverage Report'
        if: steps.detect.outputs.present == 'true' && github.event_name == 'pull_request'

      - name: Upload Surefire reports on failure
        uses: actions/upload-artifact@v7
        if: steps.detect.outputs.present == 'true' && failure()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ─── Angular ────────────────────────────────────────────────────────────────
  angular-quality:
    name: Angular — Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect Angular project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json — this repo has no Angular/Node project. Skipping Angular quality gate."
          fi

      - name: Set up Node 20
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint

      - name: Test with coverage
        if: steps.detect.outputs.present == 'true'
        run: npm run test:ci -- --code-coverage --browsers=ChromeHeadless

      - name: Check coverage thresholds
        if: steps.detect.outputs.present == 'true'
        run: npm run test:coverage-check

      - name: Upload coverage to PR
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: angular-coverage
          path: coverage/
          retention-days: 7

  # ─── Python (product application under src/) ─────────────────────────────────
  # Gated on a product-style `src/` layout. EEIK's own engine package lives in `eeik/` and is tested by
  # eeik-validate.yml, so this job skips on the eeik repo and runs in generated Python products.
  python-quality:
    name: Python — Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect Python product
        id: detect
        run: |
          if [ -d src ] && [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No src/ product layout — EEIK's own engine is covered by eeik-validate.yml. Skipping."
          fi

      - name: Set up Python 3.12
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: pip install -e ".[dev]"

      - name: Format check
        if: steps.detect.outputs.present == 'true'
        run: ruff format --check .

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: ruff check .

      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: mypy --strict src/

      - name: Test with coverage
        if: steps.detect.outputs.present == 'true'
        run: pytest --cov --cov-fail-under=80 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 7
