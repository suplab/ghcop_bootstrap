# Local development stack for the Legacy Modernization (Strangler Fig) reference architecture.
# Brings up the routing facade, a legacy-core stub, the extracted service, Postgres (stands in for
# Aurora), and Kafka so the strangler seam runs end-to-end on a laptop — flip a route flag and watch a
# capability move from the legacy stub to the new service. `docker compose up -d`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: extracted
      POSTGRES_USER: extracted
      POSTGRES_PASSWORD: extracted_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extracted -d extracted"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.6
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]

  # The legacy core, stubbed. In a real programme this is the mainframe / IBM i reached over a gateway;
  # here a tiny HTTP echo stands in so the facade has a legacy upstream to route to.
  legacy-core:
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: "9000"
    ports: ["9000:9000"]

  # The newly-extracted domain service (Spring Boot 3 in production). Swap this image for your build.
  extracted-service:
    image: public.ecr.aws/docker/library/eclipse-temurin:21-jre
    command: ["bash", "-c", "echo 'replace with the extracted service image (Spring Boot 3)'; sleep infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_URL: jdbc:postgresql://postgres:5432/extracted
      KAFKA_BOOTSTRAP: kafka:9092

  # The routing facade (the strangler seam). Per-capability flags decide legacy vs. new; flipping
  # ROUTE_POLICY_CUSTOMER between LEGACY and NEW cuts that capability over — or rolls it straight back.
  routing-facade:
    image: public.ecr.aws/docker/library/nginx:stable
    depends_on: [legacy-core, extracted-service]
    environment:
      ROUTE_POLICY_CUSTOMER: NEW
      ROUTE_POLICY_BILLING: LEGACY
      LEGACY_UPSTREAM_URL: http://legacy-core:9000
      NEW_UPSTREAM_URL: http://extracted-service:8080
    ports: ["8080:80"]
